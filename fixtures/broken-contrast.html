<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broken — low contrast text</title>
<style>
  body { margin: 0; padding: 16px; background: #f2f2f2; font-family: system-ui, sans-serif; }
  .low { color: #c9c9c9; font-size: 16px; }
  .ok { color: #222222; font-size: 16px; }
</style>
</head>
<body>
<p class="low">浅灰文字放在浅灰背景上，几乎看不清。</p>
<p class="ok">正常对比度的正文。</p>
</body>
</html>
