<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broken — content wider than viewport hidden by overflow-x</title>
<style>
  html, body { margin: 0; overflow-x: hidden; font-family: system-ui, sans-serif; }
  .wide { width: 900px; padding: 16px; background: #eeeeee; }
  .wide p { margin: 0 0 8px; }
  .wide button { min-height: 26px; }
</style>
</head>
<body>
<div class="wide">
  <p>这段内容宽度 900px，被 overflow-x: hidden 裁掉，页面不应静默通过。</p>
  <button type="button">仍然可见的按钮</button>
</div>
</body>
</html>
