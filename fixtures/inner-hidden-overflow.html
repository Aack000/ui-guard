<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broken — inner wrapper hides 900px content</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  .page { overflow-x: hidden; width: 100%; }
  .wide { width: 900px; padding: 16px; background: #eeeeee; }
  .wide p { margin: 0 0 8px; }
  .wide button { min-height: 26px; }
</style>
</head>
<body>
<div class="page">
  <div class="wide">
    <p>内层 wrapper 用 overflow-x: hidden 裁掉的 900px 内容，不应静默通过。</p>
    <button type="button">按钮</button>
  </div>
</div>
</body>
</html>
