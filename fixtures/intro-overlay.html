<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intro overlay — scanner must wait for the boot mask</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; font-family: system-ui, sans-serif; }
  #boot {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #b8ff3c;
    font-size: 24px;
  }
  .too-wide { width: 600px; margin: 16px; background: #fee; padding: 12px; }
</style>
</head>
<body>
<div id="boot" role="dialog" aria-modal="true">BOOTING…</div>
<p style="margin:16px">正常内容</p>
<div class="too-wide">这个容器 600px 宽，在 375 视口下把页面撑出水平滚动条。</div>
<script>
  setTimeout(() => document.querySelector('#boot').remove(), 2000);
</script>
</body>
</html>
