<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labeled intentional designs</title><style>
body{margin:0;padding:16px;font-family:system-ui,sans-serif}
button{min-height:26px;padding:4px 8px}
header{position:sticky;top:0;height:40px;background:#ffffff;z-index:2}
#neg-sticky-btn{position:absolute;top:10px;left:10px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.gradient{background:linear-gradient(90deg,#333,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:28px}
.clip-table{width:100%;overflow:hidden}
.clip-table table{width:800px}
.wrap{display:flex;flex-wrap:wrap;width:200px;gap:8px}
.wrap button{width:120px}
.scroller{width:200px;overflow-x:auto}
.scroller .inner{width:600px}
.glow{position:fixed;right:-100px;top:0;width:80px;height:80px;background:#eeeeee;pointer-events:none}
.ellipsis{width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;width:80px}
.vertical{writing-mode:vertical-rl;height:100px;width:30px}
.toast{position:fixed;bottom:16px;right:16px;background:#333;color:#fff;padding:8px}
</style></head><body>
<header>吸顶头部</header>
<button type="button" id="neg-sticky-btn">粘性覆盖按钮</button>
<button type="button" id="neg-disabled-small" disabled style="width:18px;height:18px;padding:0">×</button>
<span class="sr-only" id="neg-sr-only">只给屏幕阅读器的长文本</span>
<div class="gradient" id="neg-gradient">渐变文字</div>
<aside id="neg-closed" role="dialog" aria-modal="true" data-state="closed" style="position:fixed;right:0;top:0;width:240px;height:100vh;background:#fff;transform:translateX(100%)">关闭抽屉</aside>
<div class="clip-table"><table><thead><tr><th id="neg-th">表头</th></tr></thead><tbody><tr><td>单元格</td></tr></tbody></table></div>
<div class="wrap"><button type="button" id="neg-wrap-a">换行按钮 A</button><button type="button" id="neg-wrap-b">换行按钮 B</button></div>
<div class="scroller"><div class="inner" id="neg-scroller">横向滚动容器内的内容</div></div>
<div class="glow" id="neg-glow" aria-hidden="true"></div>
<div class="ellipsis" id="neg-ellipsis" title="完整文本">超长文本会被省略号截断</div>
<div class="clamp" id="neg-clamp">第一行<br>第二行<br>第三行<br>第四行</div>
<fieldset disabled><button type="button" id="neg-fieldset-btn">禁用组按钮</button></fieldset>
<div style="position:relative;width:120px;height:40px"><button type="button" id="neg-disabled-covered" disabled>禁用被覆盖</button><span style="position:absolute;inset:0;background:#eee"></span></div>
<button type="button" id="neg-24px" style="min-width:26px;min-height:26px">24px 按钮</button>
<p id="neg-high-contrast" style="color:#222;background:#fff">高对比文本</p>
<div class="vertical" id="neg-vertical">竖排文字</div>
<div id="neg-anchor" style="scroll-margin-top:100px">带 scroll-margin 的锚点</div>
<p>正文文本</p>
<div class="toast" id="neg-toast">固定提示覆盖正文</div>
</body></html>
