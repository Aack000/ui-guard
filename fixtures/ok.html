<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OK — intentional designs that must NOT be flagged</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, sans-serif; padding-top: 60px; }
  header { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: #1a1a2e; color: #fff; display: flex; align-items: center; padding: 0 16px; }
  main { padding: 16px; max-width: 960px; margin: 0 auto; }
  .cards { display: flex; flex-wrap: wrap; gap: 12px; }
  .card { flex: 1 1 200px; border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
  /* intentional single-line ellipsis */
  .ellipsis-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
  /* intentional multi-line clamp */
  .clamped { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  /* intentional horizontal scroller */
  .hscroll { display: flex; gap: 12px; overflow-x: auto; padding: 8px 0; }
  .hscroll .chip { flex: 0 0 200px; background: #eef; border-radius: 6px; padding: 12px; }
  /* intentional badge overlapping a button corner (decorative, non-interactive) */
  .btn-wrap { position: relative; display: inline-block; margin: 12px 0; }
  .badge { position: absolute; top: -6px; right: -6px; width: 16px; height: 16px; border-radius: 50%; background: #e33; color: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; }
  /* sibling buttons of different heights, center-aligned on purpose */
  .actions { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
  /* intentional overlapping avatars */
  .avatars { display: flex; margin: 12px 0; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff; }
  .avatar + .avatar { margin-left: -10px; }
  /* off-canvas drawer, closed: hidden via visibility and via opacity variants */
  .drawer-hidden { position: fixed; top: 0; right: 0; width: 280px; height: 100vh; background: #fff; transform: translateX(100%); visibility: hidden; }
  .drawer-faded { position: fixed; top: 0; right: 0; width: 280px; height: 100vh; background: #fff; transform: translateX(100%); opacity: 0; pointer-events: none; }
  button { padding: 8px 16px; }
  /* decorative fixed glow, intentionally off-screen */
  .glow { position: fixed; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(#c7d2fe, transparent); pointer-events: none; }
  .glow-1 { top: -150px; left: -150px; }
  /* intentional clipping of decorative children (no direct text) */
  .hero-decor { position: relative; overflow-x: hidden; height: 60px; }
  .hero-decor .shape { position: absolute; right: -30px; width: 100px; height: 60px; background: #eef; }
  /* intentional vertical writing */
  .vertical-text { writing-mode: vertical-rl; height: 120px; margin: 12px 0; }
</style>
</head>
<body>
<header><strong>ui-guard fixture</strong></header>
<main>
  <h1 class="ellipsis-title">这是一个很长很长很长很长很长但刻意用省略号截断的标题</h1>
  <p class="clamped">这是一段刻意两行截断的文字。这是一段刻意两行截断的文字。这是一段刻意两行截断的文字。这是一段刻意两行截断的文字。这是一段刻意两行截断的文字。这是一段刻意两行截断的文字。</p>

  <div class="hscroll">
    <div class="chip">卡片 1</div><div class="chip">卡片 2</div>
    <div class="chip">卡片 3</div><div class="chip">卡片 4</div>
  </div>

  <div class="btn-wrap">
    <button>消息</button>
    <span class="badge">3</span>
  </div>

  <div class="actions">
    <button style="padding: 4px 10px">小按钮</button>
    <button style="padding: 14px 24px">大按钮</button>
  </div>

  <div class="avatars">
    <div class="avatar" style="background:#f66"></div>
    <div class="avatar" style="background:#6f6"></div>
    <div class="avatar" style="background:#66f"></div>
  </div>

  <section class="cards">
    <div class="card">普通卡片内容</div>
    <div class="card">普通卡片内容</div>
  </section>
</main>
<aside class="drawer-hidden">关闭态抽屉（visibility）</aside>
<aside class="drawer-faded">关闭态抽屉（opacity）</aside>
<div class="glow glow-1"></div>
<div class="hero-decor"><div class="shape"></div></div>
<p class="vertical-text">刻意竖排文字</p>
</body>
</html>
